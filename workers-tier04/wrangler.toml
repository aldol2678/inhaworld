name = "inha-world-tier04"
main = "worker.js"
compatibility_date = "2026-11-13"

# No [vars] on purpose, same as Tier 01 / Tier 02 / Tier 03.
#
# DATABASE_URL is a secret and is NEVER committed here or put in [vars].
# Set it only with `wrangler secret put DATABASE_URL` (or the dashboard), and
# only to the connection string of the LIVE Neon branch (tier4-live, promoted
# to main) with the inha_world_tier4_live_app login role. Use stdin only.
#
# No routes / custom domains on the Worker itself: inhagame.app /api traffic
# reaches this Worker through the Pages Functions proxy in the
# inhagame-world-migrate project, so deploying it cannot shadow any live path
# until that proxy is added.
